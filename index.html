<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#182654"><title>星際觀察站｜一天行為時序紀錄</title>
<style>
:root{--navy:#182654;--blue:#5377c6;--lav:#e9eaff;--sky:#e3f6ff;--ink:#26345e;--muted:#6f7898;--pink:#ffe8ef;--mint:#e2f7ee;--gold:#fff3ce;--line:#dce3f4;--white:#fff;--shadow:0 14px 40px #1723511c}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(circle at 10% 5%,#f6e9ff 0,transparent 27%),radial-gradient(circle at 90% 15%,#dff5ff 0,transparent 24%),linear-gradient(140deg,#f8f9ff,#f1f5ff);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:24px 16px 56px}.hero{padding:28px 30px;border-radius:26px;background:linear-gradient(120deg,#202d65,#496db7);color:white;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:'✦  ☾  ✧';position:absolute;right:25px;top:18px;font-size:30px;opacity:.8;letter-spacing:15px}.hero h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2.25rem)}.hero p{margin:0;opacity:.9}.card{background:#ffffffed;border:1px solid #fff;border-radius:22px;padding:22px;margin-top:18px;box-shadow:var(--shadow)}.login-wrap{max-width:470px;margin:35px auto}.eyebrow{font-size:.84rem;color:var(--blue);font-weight:800;letter-spacing:.06em}h2{margin:0 0 14px;font-size:1.25rem}h3{margin:0 0 10px;font-size:1.05rem}.field{display:flex;flex-direction:column;gap:6px;margin:13px 0}.field label,.label{font-weight:750}.field input,.field select,.field textarea,textarea,input[type=date],select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid #a9c8ff70;border-color:#7297e8}textarea{min-height:78px;resize:vertical}.btn{border:0;border-radius:12px;padding:11px 17px;font-weight:800;color:#fff;background:linear-gradient(120deg,#466ac0,#6f76d9);box-shadow:0 5px 13px #425fa533}.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.btn.secondary{background:#e9edfb;color:#3c4c84;box-shadow:none}.btn.danger{background:#fae8ee;color:#963b56;box-shadow:none}.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.hint,.status{font-size:.9rem;color:var(--muted)}.status{margin-top:10px;min-height:1.4em}.hidden{display:none!important}.topline{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pills{display:flex;flex-wrap:wrap;gap:8px}.pill{border:1px solid #d9e1f4;border-radius:999px;background:#fff;padding:9px 13px;color:#42517b;font-weight:700;min-height:42px}.pill[aria-pressed="true"]{background:#516fc0;border-color:#516fc0;color:white;box-shadow:0 3px 10px #516fc033}.checkgrid{display:grid;grid-template-columns:repeat(4,minmax(115px,1fr));gap:9px}.check{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-height:45px}.check input{width:20px;height:20px;accent-color:#536fc0}.time-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;background:linear-gradient(120deg,#fff,#fafbff)}.time-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.time-name{font-weight:850}.count{font-size:.82rem;color:var(--muted)}.notes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.divider{height:1px;background:var(--line);margin:18px 0}.notice{padding:13px 15px;background:#fff7dc;border:1px solid #f3e7b5;border-radius:13px;font-size:.9rem;color:#685522}.success{padding:14px;background:var(--mint);border:1px solid #bfe8d3;border-radius:14px;color:#23664a}.err{color:#a33651}.footer{text-align:center;color:var(--muted);font-size:.82rem;padding:20px 0}.small{font-size:.82rem;color:var(--muted)}@media(max-width:700px){.shell{padding:12px 10px 35px}.hero{padding:23px 20px}.card{padding:17px}.meta-grid,.notes{grid-template-columns:1fr}.checkgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.pill{flex:1 1 42%;font-size:.9rem}.hero:after{font-size:20px;right:12px;letter-spacing:8px}}@media(min-width:1000px){.time-card{display:grid;grid-template-columns:145px 1fr;gap:12px}.time-head{align-items:flex-start;margin:7px 0 0}.time-body{min-width:0}}
</style>
</head>
<body><main class="shell">
<header class="hero"><h1>🚀 星際觀察站</h1><p>一天行為時序紀錄｜看見情境、行為與支持方式</p></header>
<section id="appPanel">
<div class="card topline"><div><span class="eyebrow">DAILY RECORD</span><h2 style="margin:4px 0 0">學生一天行為觀察</h2><p class="hint">直接填寫，完成後按「上傳到雲端」。</p></div></div>
<div class="card"><div class="meta-grid"><div class="field"><label for="obsDate">日期</label><input id="obsDate" type="date" required></div><div class="field"><label for="seat">學生座號</label><select id="seat" required><option value="">請選擇座號</option></select></div></div><div class="field"><label for="studentName">學生姓名（可選）</label><input id="studentName" maxlength="40" placeholder="可留白，或填寫姓名"></div><div class="field"><span class="label">今日狀況（可複選）</span><div id="moodChoices" class="pills"></div></div></div>
<div class="card"><div class="topline"><div><h2>一天時段快速檢核</h2><p class="hint">點選按鈕即可打勾，再點一次可取消；同一時段可複選。</p></div><button id="clearChecks" type="button" class="btn secondary">清除所有勾選</button></div><div id="timeline"></div></div>
<div class="card"><h2>事件簡記與今日觀察</h2><div class="notes"><div class="field"><label for="antecedent">① 發生前／情境</label><textarea id="antecedent" maxlength="1000" placeholder="例如：活動轉換、等待、同儕互動、課堂任務……"></textarea></div><div class="field"><label for="behavior">② 孩子做了什麼（客觀描述）</label><textarea id="behavior" maxlength="1000"></textarea></div><div class="field"><label for="response">③ 老師怎麼處理／孩子反應</label><textarea id="response" maxlength="1000"></textarea></div><div class="field"><label for="otherNote">其他補充</label><textarea id="otherNote" maxlength="1000"></textarea></div></div><div class="field"><span class="label">今日簡短觀察（可複選）</span><div id="patternChoices" class="pills"></div></div><div class="field"><label for="patternOther">其他觀察</label><input id="patternOther" maxlength="300"></div><div class="notice">按下上傳後才會送出資料，並在指定雲端資料夾建立一份紀錄文件。請確認資料夾僅授權給需要檢視的人員。</div><div class="btn-row"><button id="submitBtn" class="btn" type="button">上傳到雲端</button><button id="resetBtn" class="btn secondary" type="button">清空本頁</button></div><div id="submitStatus" class="status" aria-live="polite"></div></div>
</section><footer class="footer">星際觀察站・教師紀錄工具</footer></main>
<iframe name="transportFrame" id="transportFrame" title="資料傳送" class="hidden"></iframe>
<script>
// Apps Script 接收端部署網址。
const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxZiwar0BND0afLtdbAHT88FwJyU3_VM2o4dm3Z9LCjYPbJDgFIg4GOGfadGDeiXtG3/exec';
const periods=['外掃時間','晨光','第1堂上課','第1堂下課','第2堂上課','第2堂下課','第3堂上課','第3堂下課','第4堂上課','第4堂下課','盛飯前','用餐時','潔牙時','擦地時','午休','第5堂上課','第5堂下課','第6堂上課','第6堂下課','第7堂上課','放學時'];
const categories=['安全／傷人','尊重／拿東西','尊重／弄同學','尊重／走動','學習／不專心','學習／未完成','學習／未交功課'];
const moodOptions=['穩定','較躁動','需要較多提醒','其他'];
const patternOptions=['多發生於轉換活動','多發生於等待','多發生於同儕互動','多發生於課堂任務','無明顯規律'];
const $=id=>document.getElementById(id);let pending={};
function renderPills(target,options,name){$(target).innerHTML=options.map((o,i)=>`<button type="button" class="pill" data-group="${name}" data-value="${o}" aria-pressed="false">${o}</button>`).join('');}
renderPills('moodChoices',moodOptions,'mood');renderPills('patternChoices',patternOptions,'pattern');
for(let n=1;n<=30;n++)$('seat').insertAdjacentHTML('beforeend',`<option value="${n}">${n} 號</option>`);
$('timeline').innerHTML=periods.map((p,i)=>`<article class="time-card"><div class="time-head"><span class="time-name">${p}</span><span class="count" id="count${i}">尚未勾選</span></div><div class="time-body"><div class="checkgrid">${categories.map((c,j)=>`<label class="check"><input type="checkbox" data-period="${i}" data-category="${j}"><span>${c}</span></label>`).join('')}</div><div class="field" style="margin-bottom:0"><label class="small" for="note${i}">事件／前因／處理／結果（簡記）</label><input id="note${i}" maxlength="400" placeholder="選填"></div></div></article>`).join('');
function updateCount(i){const checked=document.querySelectorAll(`input[data-period="${i}"]:checked`).length;$('count'+i).textContent=checked?`已勾選 ${checked} 項`:'尚未勾選';}
document.querySelectorAll('input[data-period]').forEach(x=>x.addEventListener('change',()=>updateCount(x.dataset.period)));
document.addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');});
function selected(group){return [...document.querySelectorAll(`.pill[data-group="${group}"][aria-pressed="true"]`)].map(b=>b.dataset.value)}
function makePayload(){return {date:$('obsDate').value,seat:$('seat').value,name:$('studentName').value.trim(),mood:selected('mood'),periods:periods.map((time,i)=>({time,checks:[...document.querySelectorAll(`input[data-period="${i}"]:checked`)].map(x=>categories[Number(x.dataset.category)]),note:$('note'+i).value.trim()})).filter(x=>x.checks.length||x.note),antecedent:$('antecedent').value.trim(),behavior:$('behavior').value.trim(),response:$('response').value.trim(),otherNote:$('otherNote').value.trim(),patterns:selected('pattern'),patternOther:$('patternOther').value.trim()}}
function backendReady(){return GAS_WEB_APP_URL.startsWith('https://script.google.com/macros/s/')&&GAS_WEB_APP_URL.endsWith('/exec')}
function post(action,data){return new Promise((resolve,reject)=>{if(!backendReady())return reject(new Error('尚未設定雲端接收網址。請先完成 README 部署步驟，將 Apps Script /exec 網址貼入 index.html。'));const nonce=crypto.randomUUID().replaceAll('-','');pending[nonce]={resolve,reject};const form=document.createElement('form');form.method='POST';form.action=GAS_WEB_APP_URL;form.target='transportFrame';form.style.display='none';const a=document.createElement('input');a.name='action';a.value=action;const p=document.createElement('textarea');p.name='payload';p.value=JSON.stringify({...data,nonce});form.append(a,p);document.body.append(form);form.submit();form.remove();setTimeout(()=>{if(pending[nonce]){delete pending[nonce];reject(new Error('連線逾時，請檢查 Apps Script 網址與部署權限後重試。'))}},25000)})}
window.addEventListener('message',event=>{if(event.source!==$('transportFrame').contentWindow||!event.data||!event.data.nonce)return;const task=pending[event.data.nonce];if(!task)return;delete pending[event.data.nonce];task.resolve(event.data)});
if(!$('obsDate').value)$('obsDate').value=new Date().toLocaleDateString('en-CA');
$('submitBtn').onclick=async()=>{if(!$('obsDate').value||!$('seat').value){$('submitStatus').textContent='請先選擇日期與學生座號。';$('submitStatus').className='status err';return}const btn=$('submitBtn');btn.disabled=true;btn.textContent='正在送出…';$('submitStatus').textContent='';try{const r=await post('submit',makePayload());if(!r.ok)throw new Error(r.message||'上傳失敗');$('submitStatus').textContent='已成功上傳並建立雲端紀錄！';$('submitStatus').className='status success'}catch(err){$('submitStatus').textContent=err.message;$('submitStatus').className='status err'}finally{btn.disabled=false;btn.textContent='上傳到雲端'}};
$('clearChecks').onclick=()=>{document.querySelectorAll('input[data-period]').forEach(x=>x.checked=false);periods.forEach((_,i)=>updateCount(i))};
$('resetBtn').onclick=()=>{if(!confirm('確定清空目前填寫內容？'))return;document.querySelectorAll('input[data-period]').forEach(x=>x.checked=false);periods.forEach((_,i)=>{$('note'+i).value='';updateCount(i)});['studentName','antecedent','behavior','response','otherNote','patternOther'].forEach(id=>$(id).value='');$('seat').value='';document.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed','false'));$('submitStatus').textContent=''};
</script></body></html>
